[build-system]
requires = ["setuptools~=80.9", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nvdaClipboard"
dynamic = ["version"]
description = "NVDA Clipboard add-on for NVDA"
maintainers = [
	{name = "Cary-rowen", email = "manchen_0528@outlook.com"},
]
requires-python = ">=3.13,<3.14"
classifiers = [
	"Development Status :: 3 - Alpha",
	"Intended Audience :: End Users/Desktop",
	"License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
	"Operating System :: Microsoft :: Windows",
	"Programming Language :: Python :: 3",
	"Topic :: Accessibility",
]
readme = "readme.md"
license = {file = "COPYING.txt"}
# This package is not installed as a library; every dependency is tooling used to
# build, translate, or lint the add-on. They are declared as PEP 735 dependency groups.
dependencies = []
[project.urls]
Repository = "https://github.com/cary-rowen/NVDAClipboard"

# PEP 735 dependency groups. `uv sync` installs the `dev` group by default, which
# pulls in every tool needed to build, translate, and lint the add-on.
[dependency-groups]
# Build add-on
build = [
	"scons==4.10.1",
	"Markdown==3.10",
]
# Match the Pillow version bundled with NVDA for image codec checks.
test = [
	"Pillow==12.2.0",
]
# Translations management
l10n = [
	"nh3==0.3.2",
	"crowdin-api-client==1.24.1",
	"lxml==6.1.0",
	"mdx_truly_sane_lists==1.3",
	"markdown-link-attr-modifier==0.2.1",
	"mdx-gh-links==0.4",
]
# Lint
lint = [
	"uv==0.11.15",
	"ruff==0.14.5",
	"prek==0.4.8",
	"pyright[nodejs]==1.1.407",
]
dev = [
	{ include-group = "build" },
	{ include-group = "l10n" },
	{ include-group = "lint" },
	{ include-group = "test" },
]

[tool.ruff]
line-length = 110

builtins = [
	# translation lookup
	"_",
	# translation lookup
	"ngettext",
	# translation lookup
	"pgettext",
	# translation lookup
	"npgettext",
]

include = [
	"*.py",
	"sconstruct",
]

exclude = [
	".git",
	"__pycache__",
	".venv",
	"addon/globalPlugins/nvdaClipboard/_vendor",
	"buildVars.py",
]

[tool.ruff.format]
indent-style = "tab"
line-ending = "lf"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint]
extend-select = ["C901"]
ignore = [
	# indentation contains tabs
	"W191",
]
logger-objects = ["logHandler.log"]

[tool.ruff.lint.per-file-ignores]
# sconscripts contains many inbuilt functions not recognised by the lint,
# so ignore F821.
"sconstruct" = ["F821"]

[tool.pyright]
venvPath = ".venv"
venv = "."
pythonPlatform = "Windows"
typeCheckingMode = "strict"

include = [
	"addon/**/*.py",
]

exclude = [
	"sconstruct",
	".git",
	"__pycache__",
	".venv",
	"site_scons",
	".github/scripts",
	"tests",
]

# NVDA's source tree is normally checked out beside the add-on repository.
# Keep this path configurable for developers whose checkout layout differs.
extraPaths = [
	"./addon",
	"../nvda/source",
]

analyzeUnannotatedFunctions = true
deprecateTypingAliases = true
strictParameterNoneValue = true
strictListInference = true
strictDictionaryInference = true
strictSetInference = true

# The add-on imports NVDA's dynamically typed APIs and bundled native modules.
# Keep Pyright available for incremental cleanup while allowing those boundaries.
reportMissingImports = false
reportMissingModuleSource = false
reportMissingTypeStubs = false
